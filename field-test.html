<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>校内の測位テスト</title>
<style>
*{box-sizing:border-box}body{margin:auto;max-width:36rem;padding:20px;background:#f5f8f8;color:#173239;font:1rem/1.65 system-ui,sans-serif}h1{font-size:1.55rem}section{background:white;border:1px solid #d4dfde;border-radius:14px;padding:16px;margin:14px 0}button,select{font:inherit;padding:9px 12px;border:1px solid #577573;border-radius:8px;background:white;color:#163c38}button{cursor:pointer}button:disabled{opacity:.48}#mark{background:#175b52;color:white;margin-top:10px}output{display:block;font-size:1.22rem;font-weight:650}li{margin:.55rem 0}small{color:#526564}</style></head>
<body><main><h1>校内の測位テスト</h1><p>廊下の目印を2つ決めます。Aで記録 → Bまで歩いて記録 → Aに戻って記録。同じ階で試すと、移動距離と測位のずれを比べられます。</p>
<section><button id="toggle">測位を始める</button> <label>今いる階 <select id="floor"><option>1階</option><option>2階</option><option>3階</option><option>4階</option><option>その他</option></select></label>
<p id="status" role="status">位置情報の許可が必要です。</p><output id="live"></output><small id="accuracy"></small><br><button id="mark" disabled>A（出発点）を記録</button></section>
<section><strong>測定結果</strong><ol id="results"></ol><p id="summary" role="status">記録はこの画面にだけ残ります。</p><button id="reset" hidden>もう一度試す</button></section>
<small>階は手動で記録します。アプリは測定結果を送信しません。残したい結果は画面を閉じる前にスクリーンショットしてください。</small></main>
<script>
const el = id => document.getElementById(id);
const labels = ['A（出発点）','B（折り返し点）','A（戻った地点）'];
let watcher = null, epoch = 0, fix = null, expiry, marks = [];
function distance(a,b) {
  const rad = Math.PI/180;
  const h = Math.sin((b.lat-a.lat)*rad/2)**2 + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin((b.lon-a.lon)*rad/2)**2;
  return Math.round(12742000*Math.asin(Math.sqrt(Math.min(1,h))));
}
function clearFix() {
  clearTimeout(expiry); fix = null; el('live').textContent=''; el('accuracy').textContent=''; el('mark').disabled=true;
}
function stop() {
  epoch++; if(watcher!==null) navigator.geolocation.clearWatch(watcher);
  watcher=null; clearFix(); el('toggle').textContent='測位を始める'; el('status').textContent='停止しました。';
}
el('toggle').onclick=()=>{
  if(watcher!==null){stop();return;}
  if(!navigator.geolocation){el('status').textContent='このブラウザは位置情報に対応していません。';return;}
  const run=++epoch; el('status').textContent='端末の位置を取得しています…';
  el('toggle').textContent='測位を止める';
  try { watcher=navigator.geolocation.watchPosition(p=>{
    if(run!==epoch)return;
    const {latitude:lat,longitude:lon,accuracy:acc}=p.coords, t=p.timestamp;
    const age=Date.now()-t;
    if(![lat,lon,acc,t].every(Number.isFinite)||acc<0||age>=30000||(fix&&t<fix.t))return;
    fix={lat,lon,acc,t};
    el('status').textContent='測位中'; el('live').textContent=marks.length?'出発点から約 '+distance(marks[0],fix)+' m':'出発点で記録してください';
    el('accuracy').textContent='推定誤差 約 '+Math.ceil(acc)+' m ／ '+new Date(t).toLocaleTimeString('ja-JP');
    el('mark').disabled=marks.length>=3 || (marks.length>0 && marks[marks.length-1].t>=t);
    clearTimeout(expiry); expiry=setTimeout(()=>{clearFix();el('status').textContent='新しい測位を待っています。';},30000-Math.max(age,0));
  },e=>{
    if(run!==epoch)return;
    if(e.code===1){stop();el('status').textContent='位置情報が許可されていません。サイト設定で許可して再開してください。';}
    else {clearFix();el('status').textContent='位置を取得できません。次の測位を待っています。';}
  },{enableHighAccuracy:true,maximumAge:0,timeout:15000}); }
  catch {stop();el('status').textContent='位置情報を利用できません。ブラウザの設定を確認してください。';}
};
el('mark').onclick=()=>{
  if(!fix||Date.now()-fix.t>=30000||marks.length>=3)return;
  const i=marks.length, point={...fix,floor:el('floor').value}; marks.push(point);
  const row=document.createElement('li'); row.textContent=labels[i]+'・'+point.floor+' ／ 誤差 約'+Math.ceil(point.acc)+' m ／ '+new Date(point.t).toLocaleTimeString('ja-JP'); el('results').append(row);
  el('mark').disabled=true; el('reset').hidden=false;
  if(i<2){el('mark').textContent=labels[i+1]+'を記録';el('status').textContent='次の地点で新しい測位を待って記録してください。';return;}
  const outward=distance(marks[0],marks[1]), drift=distance(marks[0],marks[2]);
  stop();el('mark').hidden=true;
  el('summary').textContent='A→Bの測定距離は約'+outward+' m。同じAに戻ったときのずれは約'+drift+' mです。実際の目印間の距離と比べてください。';
};
el('reset').onclick=()=>{stop();marks=[];el('results').replaceChildren();el('summary').textContent='記録はこの画面にだけ残ります。';el('mark').textContent=labels[0]+'を記録';el('mark').hidden=false;el('reset').hidden=true;};
window.addEventListener('pagehide',stop);
</script></body></html>
