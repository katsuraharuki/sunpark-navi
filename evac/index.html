<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>避難誘導 スタッフ用</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;700&display=swap">
<link rel="stylesheet" href="evac.css">
</head>
<body>
<header class="top"><div class="top-in">
  <p class="place">おのだサンパーク</p>
  <h1>避難誘導 <span class="sub-h">館スタッフ用</span><span class="tag">見本</span></h1>
</div></header>

<main>
  <p class="notice">出口は、案内図の入口を出口として仮置きしています。非常口は館の防災図で差し替えます。</p>

  <section class="step" aria-labelledby="h-hz">
    <h2 id="h-hz" class="h"><span class="num">1</span>危ない場所を置く</h2>
    <div class="row">
      <div class="seg-wrap" role="group" aria-label="地図をタップした時">
        <button class="seg on" data-tool="hz">火元・危ない場所</button>
        <button class="seg" data-tool="here">今いる場所</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl">広さ</span>
      <div class="seg-wrap small" role="group" aria-label="危ない場所の広さ">
        <button class="seg" data-r="s">小</button>
        <button class="seg on" data-r="m">中</button>
        <button class="seg" data-r="l">大</button>
      </div>
    </div>
  </section>

  <div class="map-head">
    <div class="floors" role="group" aria-label="階">
      <button class="fl on" data-fl="1">1F</button><button class="fl" data-fl="2">2F</button>
    </div>
    <div class="zoom" role="group" aria-label="地図の大きさ">
      <button class="zb" id="z-out" aria-label="小さく">−</button><span id="z-val">2倍</span><button class="zb" id="z-in" aria-label="大きく">＋</button>
    </div>
  </div>
  <div id="map" class="map" aria-label="地図。タップすると、選んでいる印を置きます"></div>
  <p class="tap-hint" id="tap-hint">地図をタップすると、火元・危ない場所を置きます（もう一度タップで消す）</p>
  <div id="hz-list" class="hz-list"></div>

  <section class="step" aria-labelledby="h-here">
    <h2 id="h-here" class="h"><span class="num">2</span>今いる場所</h2>
    <div class="search-box">
      <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="店名で探す（例：ユニクロ、DAISO）" autocomplete="off" enterkeyhint="search" aria-label="今いる場所を店名で探す">
    </div>
    <ul id="results" class="results"></ul>
    <label class="check"><input type="checkbox" id="wc"> 車いすの方がいる</label>
  </section>

  <section id="out" class="out" aria-live="polite"></section>

  <section class="step" aria-labelledby="h-all">
    <h2 id="h-all" class="h"><span class="num">3</span>全館の避難状況</h2>
    <button id="survey" class="big">全店から出口までを一括で出す</button>
    <div id="survey-out"></div>
  </section>

  <p class="foot">見本です。非常口・防火扉・避難経路は館の消防計画で差し替えて使います（現地未確認）</p>
</main>

<script src="../mapdata.js"></script>
<script src="evac-core.js"></script>
<script src="evac-app.js"></script>
</body>
</html>
